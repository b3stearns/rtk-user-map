<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TrueNav Live — Dealer login</title>
  <link rel="icon" href="https://cdn.jsdelivr.net/gh/b3stearns/rtk-user-map@main/favicon.ico">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f4f6f8;
      color: #1a1a1a;
    }
    .box {
      width: min(400px, calc(100% - 32px));
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 28px 24px;
      box-shadow: 0 8px 24px rgba(0,0,0,.06);
    }
    .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
    .brand img { height: 36px; width: auto; }
    .brand b { font-size: 16px; }
    .sub { color: #666; font-size: 13px; margin: 0 0 20px; }
    label { display: block; font-size: 12px; color: #555; margin: 0 0 6px; }
    input {
      width: 100%;
      border: 1px solid #ccc;
      border-radius: 6px;
      padding: 10px 12px;
      font: inherit;
      margin-bottom: 14px;
    }
    button {
      width: 100%;
      background: #1a73e8;
      color: #fff;
      border: 0;
      border-radius: 6px;
      padding: 11px;
      font-weight: 700;
      cursor: pointer;
      font-size: 15px;
    }
    button:hover { background: #1557b0; }
    #err {
      display: none;
      color: #b00020;
      font-size: 13px;
      margin: 0 0 12px;
      background: #fdecea;
      border: 1px solid #f5c2c0;
      border-radius: 6px;
      padding: 8px 10px;
    }
  </style>
</head>
<body>
  <form class="box" id="f" autocomplete="on">
    <div class="brand">
      <img src="https://cdn.jsdelivr.net/gh/b3stearns/rtk-user-map@main/truenav-logo.png" alt="TrueNav">
      <b>TrueNav Live</b>
    </div>
    <p class="sub">Dealer map — sign in to view RTK users</p>
    <div id="err">Invalid username or password</div>
    <label for="u">Username</label>
    <input id="u" name="username" autocomplete="username" required>
    <label for="p">Password</label>
    <input id="p" name="password" type="password" autocomplete="current-password" required>
    <button type="submit">Sign in</button>
  </form>
  <script>
    (async () => {
      try {
        const me = await fetch("/api/me", { credentials: "same-origin" });
        if (me.ok) location.replace("/");
      } catch (e) {}
    })();
    document.getElementById("f").onsubmit = async (e) => {
      e.preventDefault();
      const err = document.getElementById("err");
      err.style.display = "none";
      const r = await fetch("/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        credentials: "same-origin",
        body: JSON.stringify({
          username: document.getElementById("u").value,
          password: document.getElementById("p").value
        })
      });
      if (!r.ok) { err.style.display = "block"; return; }
      location.replace("/");
    };
  </script>
</body>
</html>
