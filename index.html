<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://unpkg.com https://cdn.jsdelivr.net 'unsafe-inline' 'unsafe-eval'; style-src 'self' https://unpkg.com 'unsafe-inline'; img-src 'self' data: https://*.tile.openstreetmap.org https://server.arcgisonline.com https://unpkg.com; connect-src 'self' https://*.vercel.app;">
  <title>TrueNav Active User Map</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link href="/output.css" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; }
    .container { 
      display: flex; 
      flex-direction: column; 
      height: 100vh; 
      background-color: #f0f4f8; 
    }
    .branding {
      display: flex;
      align-items: center;
      margin-right: 2rem;
    }
    .branding img {
      height: 40px;
      width: auto;
    }
    #map { 
      flex: 1; 
      height: calc(100vh - 60px); /* Adjust for header height */
    }
    .leaflet-popup-content {
      font-size: 0.9rem;
      line-height: 1.4;
    }
    .leaflet-popup-content strong {
      display: inline-block;
      width: 120px;
      font-weight: 700;
    }
    .recent-marker-glow {
      position: relative;
      z-index: 1000;
      display: inline-block;
    }
    .recent-marker-glow::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 45px;
      height: 45px;
      background: rgba(0, 255, 0, 0.5);
      border-radius: 50%;
      z-index: -1;
      animation: glow 1.5s ease-in-out infinite;
    }
    @keyframes glow {
      0% { opacity: 0.5; }
      50% { opacity: 0.8; }
      100% { opacity: 0.5; }
    }
    .leaflet-control-legend {
      background: white;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
      box-shadow: 0 0 5px rgba(0, 0, 0, 0.2);
    }
    .legend-item {
      display: flex;
      align-items: center;
      margin-bottom: 5px;
    }
    .legend-item img {
      width: 30px;
      height: 30px;
      margin-right: 5px;
    }
    .legend-item span {
      font-size: 0.9rem;
    }
    .leaflet-control-logo {
      background: transparent;
      border: none;
      box-shadow: none;
    }
    .leaflet-control-logo img {
      width: 200px;
      height: auto;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="/src/UserMap.js"></script>
</body>
</html>
