<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TruNav RTK User Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    #map { height: 100vh; width: 100%; }
    body { margin:0; font-family: Arial, sans-serif; }
    .filters {
      position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
      z-index: 1000; background: white; padding: 8px 14px; border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.25); display: flex; gap: 10px;
    }
  </style>
</head>
<body>
  <div class="filters">
    <select id="timeFilter">
      <option value="12">Last 12 Hours</option>
      <option value="24" selected>Last 24 Hours</option>
      <option value="168">Last 7 Days</option>
    </select>
    <select id="hardwareFilter"><option value="">All Hardware</option></select>
    <select id="userFilter"><option value="">All Users</option></select>
  </div>
  <div id="map"></div>

<script>
let map, logMarkers = [], baseMarkers = [], lines = [], allData = [];
let baseMap = new Map();

function getLogIcon(p) {
  const m = (p.mountpoint || p.station || p.partner || '').toLowerCase();
  let iconFile = '../default.png';

  if (m.includes('jd') || m.includes('john') || m.includes('deere')) {
    iconFile = '../JohnDeereDevice.png';
  } else if (m.includes('trimble')) {
    iconFile = '../TrimbleGCS900Device.png';
  } else if (m.includes('case') || m.includes('cnh')) {
    iconFile = '../CNHIndustrialDevice.png';
  } else if (m.includes('topcon')) {
    iconFile = '../TopconDevice.png';
  } else if (m.includes('outback')) {
    iconFile = '../OutbackDevice.png';
  } else if (m.includes('dji')) {
    iconFile = '../DJIDevice.png';
  } else if (m.includes('fjd')) {
    iconFile = '../FJDDevice.png';
  }

  return L.divIcon({
    className: 'custom-marker',
    html: `<img src="${iconFile}" style="width:32px;height:32px;object-fit:contain;" onerror="this.src='../default.png'">`,
    iconSize: [32, 32],
    iconAnchor: [16, 32],
    popupAnchor: [0, -28]
  });
}

function createLogPopup(p) {
  const shortStation = p.station ? String(p.station).slice(-4) : 'N/A';
  let distMiles = 'N/A';
  if (p.distance != null) {
    const km = parseFloat(p.distance);
    if (!isNaN(km)) distMiles = (km * 0.621371).toFixed(2) + ' miles';
  }
  let signInCST = 'N/A';
  if (p.loginTime) {
    signInCST = new Date(p.loginTime).toLocaleString('en-US', {timeZone:'America/Chicago'}) + ' CST';
  }
  const fixRate = p.rtkfix ?? p['rtk fix rate(%)'] ?? p.fixRate ?? 'N/A';

  return `
    <b>Distance to Station:</b> ${distMiles}<br>
    <b>username:</b> ${p.username}<br>
    <b>Sign in time (CST):</b> ${signInCST}<br>
    <b>status:</b> <span style="color:green">${p.status || p.msg}</span><br>
    <b>rtk fix rate(%):</b> ${fixRate}<br>
    <b>station:</b> ${shortStation}<br>
    <b>ip:</b> ${p.ip || 'N/A'}<br>
    <b>latest nmea:</b> ${p.GGA || 'N/A'}
  `;
}

async function loadBaseStations() {
  const res = await fetch('/api/bases');
  const json = await res.json();
  (json.data || []).forEach(b => {
    const id = b.station || b.name;
    baseMap.set(id, { lat: b.latitude, lng: b.longitude, name: b.name });

    const marker = L.circleMarker([b.latitude, b.longitude], {
      color: '#1a73e8',
      fillColor: '#4285f4',
      fillOpacity: 0.95,
      radius: 9,
      weight: 3
    }).bindPopup(`<b>${b.name || b.station}</b>`);

    marker.addTo(map);
    baseMarkers.push(marker);
  });
}

function drawLines() {
  lines.forEach(l => map.removeLayer(l)); lines = [];
  allData.forEach(p => {
    if (!p.station) return;
    const base = baseMap.get(p.station);
    if (base) {
      const line = L.polyline([[p.latitude, p.longitude], [base.lat, base.lng]], {
        color: '#e53935', weight: 2.5, opacity: 0.75
      }).addTo(map);
      lines.push(line);
    }
  });
}

async function fetchData(hours = 24) {
  const res = await fetch(`/api/sheets?hours=${hours}`);
  const json = await res.json();
  allData = json.data || [];

  logMarkers.forEach(m => map.removeLayer(m)); logMarkers = [];
  lines.forEach(l => map.removeLayer(l)); lines = [];

  allData.forEach(p => {
    const m = L.marker([p.latitude, p.longitude], {icon: getLogIcon(p)}).bindPopup(createLogPopup(p));
    m.addTo(map);
    logMarkers.push(m);
  });

  if (baseMap.size > 0) drawLines();
}

window.onload = async () => {
  map = L.map('map').setView([43.6, -97.5], 7);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

  document.getElementById('timeFilter').onchange = () => fetchData(parseInt(document.getElementById('timeFilter').value));

  await loadBaseStations();
  await fetchData(24);

  setInterval(async () => {
    await fetchData(parseInt(document.getElementById('timeFilter').value));
  }, 300000);
};
</script>
</body>
</html>
