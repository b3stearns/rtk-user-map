let map, logMarkers = [], baseMarkers = [], lines = [], allData = [];
let baseMap = new Map();
let lastDataCount = 0;

function getLogIcon(p) {
  const m = (p.mountpoint || p.station || p.partner || '').toLowerCase();
  let iconFile = 'default.png';

  if (m.includes('jd') || m.includes('john') || m.includes('deere')) {
    iconFile = 'JohnDeereDevice.png';
  } else if (m.includes('trimble')) {
    iconFile = 'TrimbleGCS900Device.png';
  } else if (m.includes('case') || m.includes('cnh')) {
    iconFile = 'CNHIndustrialDevice.png';
  } else if (m.includes('topcon')) {
    iconFile = 'TopconDevice.png';
  } else if (m.includes('outback')) {
    iconFile = 'OutbackDevice.png';
  } else if (m.includes('dji')) {
    iconFile = 'DJIDevice.png';
  } else if (m.includes('fjd')) {
    iconFile = 'FJDDevice.png';
  }

  return L.icon({
    iconUrl: `/${iconFile}`,
    iconSize: [32, 32],
    iconAnchor: [16, 32],
    popupAnchor: [0, -28]
  });
}
function formatDuration(seconds) {
  if (!seconds || isNaN(seconds)) return 'N/A';
  const h = Math.floor(seconds / 3600);
  const m = Math.floor((seconds % 3600) / 60);
  const s = Math.floor(seconds % 60);
  return `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
}

function createLogPopup(p) {
  const shortStation = p.station ? String(p.station).slice(-4) : 'N/A';
  let distMiles = 'N/A';
  if (p.distance != null) {
    const km = parseFloat(p.distance);
    if (!isNaN(km)) distMiles = (km * 0.621371).toFixed(2) + ' miles';
  }
  let signInCST = 'N/A';
  if (p.loginTime) {
    signInCST = new Date(p.loginTime).toLocaleString('en-US', {timeZone:'America/Chicago'}) + ' CST';
  }
  const fixRate = parseFloat(p.rtkfix || p['rtk fix rate(%)'] || p.fixRate) || 0;
  const fixColor = fixRate >= 90 ? 'green' : 'black';
  const sessionTime = formatDuration(p.duration || p.sessionTime);

  return `
    <b>Distance to Station:</b> ${distMiles}<br>
    <b>username:</b> ${p.username || 'N/A'}<br>
    <b>partner:</b> ${p.partner || 'N/A'}<br>
    <b>Sign in time (CST):</b> ${signInCST}<br>
    <b>Session time:</b> ${sessionTime}<br>
    <b>status:</b> <span style="color:green">${p.status || p.msg || 'N/A'}</span><br>
    <b>rtk fix rate(%):</b> <span style="color:${fixColor}">${fixRate || 'N/A'}</span><br>
    <b>station:</b> ${shortStation}<br>
    <b>spp / dgps / fixed / float:</b> ${p.spp || 0} / ${p.dgps || 0} / ${p.rtkfix || 0} / ${p.float || 0}<br>
    <b>avg age / max age:</b> ${p.avgAge || 'N/A'} / ${p.maxAge || 'N/A'}<br>
    <b>ip:</b> ${p.ip || 'N/A'}
  `;
}

function loadBaseStations() {
  myStations.forEach(b => {
    const id = b.id || b.name;
    baseMap.set(id, { lat: b.lat, lng: b.lng, name: b.name });

    const marker = L.circleMarker([b.lat, b.lng], {
      color: '#1a73e8', fillColor: '#34a853', fillOpacity: 0.9, radius: 8, weight: 2
    }).bindPopup(`<b>${b.name}</b>`);
    marker.addTo(map);
    baseMarkers.push(marker);
  });
}

function drawLines(dataToDraw = allData) {
  lines.forEach(l => map.removeLayer(l)); lines = [];
  dataToDraw.forEach(p => {
    if (!p.station) return;
    let base = baseMap.get(p.station);
    if (!base) {
      for (let [key, val] of baseMap) {
        if (key.includes(p.station) || p.station.includes(key)) { base = val; break; }
      }
    }
    if (base) {
      const line = L.polyline([[p.latitude, p.longitude], [base.lat, base.lng]], {
        color: '#e53935', weight: 2.5, opacity: 0.75
      }).addTo(map);
      lines.push(line);
    }
  });
}

async function fetchData(hours = 24) {
  const res = await fetch(`/api/sheets?hours=${hours}`);
  const json = await res.json();
  allData = json.data || [];

  if (allData.length === lastDataCount && document.getElementById('userFilter').value === '') return;
  lastDataCount = allData.length;

  logMarkers.forEach(m => map.removeLayer(m)); logMarkers = [];
  lines.forEach(l => map.removeLayer(l)); lines = [];

  const userSel = document.getElementById('userFilter');
  const currentUser = userSel.value;

  userSel.innerHTML = '<option value="">All Users</option>';
  const uniqueUsers = [...new Set(allData.map(d => d.username).filter(Boolean))];
  uniqueUsers.forEach(u => {
    const opt = document.createElement('option');
    opt.value = u; opt.textContent = u;
    userSel.appendChild(opt);
  });
  userSel.value = currentUser;

  let filtered = allData;
  if (currentUser) filtered = allData.filter(d => d.username === currentUser);

  filtered.forEach(p => {
    const m = L.marker([p.latitude, p.longitude], {icon: getLogIcon(p)}).bindPopup(createLogPopup(p));
    m.addTo(map);
    logMarkers.push(m);
  });

  updateSummary(filtered);
  drawLines(filtered);
}

function updateSummary(data) {
  const users = new Set(data.map(d => d.username).filter(Boolean));
  document.getElementById('sumUsers').textContent = users.size;

  const fixRates = data
    .map(d => parseFloat(d.rtkfix || d['rtk fix rate(%)'] || d.fixRate || d.rtkFixRate))
    .filter(n => !isNaN(n) && n > 0);
  const avgFix = fixRates.length ? (fixRates.reduce((a,b)=>a+b,0) / fixRates.length).toFixed(1) : 0;
  document.getElementById('sumFix').textContent = avgFix + '%';

  const dists = data.map(d => parseFloat(d.distance)).filter(n => !isNaN(n));
  const avgDistKm = dists.length ? dists.reduce((a,b)=>a+b,0) / dists.length : 0;
  document.getElementById('sumDist').textContent = (avgDistKm * 0.621371).toFixed(1) + ' miles';

  const durations = data.map(d => parseFloat(d.duration)).filter(n => !isNaN(n));
  const totalSeconds = durations.reduce((a, b) => a + b, 0);
  const totalHours = (totalSeconds / 3600).toFixed(1);
  document.getElementById('sumTime').textContent = totalHours + ' hrs';
}

window.onload = async () => {
  map = L.map('map').setView([43.6, -97.5], 7);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

  document.getElementById('timeFilter').onchange = () => fetchData(parseInt(document.getElementById('timeFilter').value));
  document.getElementById('userFilter').onchange = () => fetchData(parseInt(document.getElementById('timeFilter').value));

  loadBaseStations();
  await fetchData(24);

  setInterval(async () => {
    await fetchData(parseInt(document.getElementById('timeFilter').value));
  }, 600000);
};
