<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TruNav RTK User Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="output.css">
    <style>
        #map { height: 100vh; width: 100%; }
        .leaflet-popup-content { max-height: 300px; overflow-y: auto; }
    </style>
</head>
<body class="bg-gray-900 text-white">
    <div class="flex flex-col h-screen">
        <header class="bg-black p-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <img src="truenav-logo.png" alt="TruNav" class="h-10">
                <h1 class="text-2xl font-bold">GEODNET RTK User Map</h1>
            </div>
            <div class="flex gap-4">
                <input id="usernameFilter" type="text" placeholder="Filter by username..." 
                       class="bg-gray-800 text-white px-4 py-2 rounded">
                <button onclick="fetchData()" 
                        class="bg-blue-600 hover:bg-blue-700 px-6 py-2 rounded">
                    Refresh Map
                </button>
            </div>
        </header>
        
        <div id="map" class="flex-1"></div>
    </div>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script>
        // Simple vanilla JS fallback + fetch from new API
        let map;
        let clientMarkers = [];

        async function fetchData() {
            try {
                const res = await fetch('/api/sheets');
                const data = await res.json();
                
                // Clear old markers
                clientMarkers.forEach(m => map.removeLayer(m));
                clientMarkers = [];

                data.data.forEach(station => {
                    const marker = L.marker([station.latitude, station.longitude], {
                        icon: L.icon({
                            iconUrl: 'default.png',
                            iconSize: [32, 32]
                        })
                    }).bindPopup(`
                        <b>${station.username || station.name}</b><br>
                        Miner: ${station.miner_sn}<br>
                        Status: ${station.status || 'Online'}
                    `);
                    marker.addTo(map);
                    clientMarkers.push(marker);
                });

                console.log(`Loaded ${data.data.length} stations`);
            } catch (e) {
                console.error("Failed to load map data", e);
            }
        }

        // Initialize map
        window.onload = () => {
            map = L.map('map').setView([43.5, -96.7], 7);
            
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; OpenStreetMap contributors'
            }).addTo(map);

            // Load base stations (static)
            // Add your base station markers here if needed

            fetchData();
            setInterval(fetchData, 300000); // Refresh every 5 min
        };
    </script>
</body>
</html>
