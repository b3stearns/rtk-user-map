<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TruNav RTK User Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    #map { height: 100vh; width: 100%; }
    body { margin:0; font-family: Arial, sans-serif; }
    .filters {
      position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
      z-index: 1000; background: white; padding: 8px 14px; border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.25); display: flex; gap: 10px;
    }
  </style>
</head>
<body>
  <div class="filters">
    <select id="timeFilter">
      <option value="12">Last 12 Hours</option>
      <option value="24" selected>Last 24 Hours</option>
      <option value="168">Last 7 Days</option>
    </select>
    <select id="hardwareFilter"><option value="">All Hardware</option></select>
    <select id="userFilter"><option value="">All Users</option></select>
  </div>
  <div id="map"></div>

<script>
let map, logMarkers = [], baseMarkers = [], lines = [], allData = [];

function getLogIcon(p) {
  const m = (p.mountpoint || p.station || '').toLowerCase();
  if (m.includes('jd') || m.includes('john')) return L.divIcon({html:'🟢', iconSize:[22,22]});
  if (m.includes('trimble')) return L.divIcon({html:'🔵', iconSize:[22,22]});
  if (m.includes('case')) return L.divIcon({html:'🟠', iconSize:[22,22]});
  return L.divIcon({html:'📍', iconSize:[18,18]});
}

function createLogPopup(p) {
  const shortStation = p.station ? String(p.station).slice(-4) : 'N/A';
  let distMiles = 'N/A';
  if (p.distance != null) {
    const km = parseFloat(p.distance);
    if (!isNaN(km)) distMiles = (km * 0.621371).toFixed(2) + ' miles';
  }
  let signInCST = 'N/A';
  if (p.loginTime) {
    signInCST = new Date(p.loginTime).toLocaleString('en-US', {timeZone:'America/Chicago'}) + ' CST';
  }
  const fixRate = p.rtkfix ?? p['rtk fix rate(%)'] ?? p.fixRate ?? 'N/A';

  return `
    <b>Distance to Station:</b> ${distMiles}<br>
    <b>username:</b> ${p.username}<br>
    <b>Sign in time (CST):</b> ${signInCST}<br>
    <b>status:</b> <span style="color:green">${p.status || p.msg}</span><br>
    <b>rtk fix rate(%):</b> ${fixRate}<br>
    <b>station:</b> ${shortStation}<br>
    <b>ip:</b> ${p.ip || 'N/A'}<br>
    <b>latest nmea:</b> ${p.GGA || 'N/A'}
  `;
}

function drawRedLine(logLat, logLng, stationId) {
  // This will be populated after bases load
  return null; // lines handled after bases are loaded
}

async function loadBaseStations() {
  try {
    const res = await fetch('/api/bases');
    const json = await res.json();
    (json.data || []).forEach(b => {
      const marker = L.circleMarker([b.latitude, b.longitude], {
        color: '#0066ff',
        fillColor: '#0066ff',
        fillOpacity: 0.9,
        radius: 8,          // larger
        weight: 2
      }).bindPopup(`<b>${b.name || b.station || 'Base Station'}</b>`);
      marker.addTo(map);
      baseMarkers.push(marker);
    });
  } catch (e) {
    console.error('Failed to load base stations', e);
  }
}

async function fetchData(hours = 24) {
  const res = await fetch(`/api/sheets?hours=${hours}`);
  const json = await res.json();
  allData = json.data || [];

  logMarkers.forEach(m => map.removeLayer(m)); logMarkers = [];
  lines.forEach(l => map.removeLayer(l)); lines = [];

  allData.forEach(p => {
    const m = L.marker([p.latitude, p.longitude], {icon: getLogIcon(p)}).bindPopup(createLogPopup(p));
    m.addTo(map);
    logMarkers.push(m);
  });
}

window.onload = async () => {
  map = L.map('map').setView([43.6, -97.5], 7);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

  document.getElementById('timeFilter').onchange = () => fetchData(parseInt(document.getElementById('timeFilter').value));

  await loadBaseStations();   // blue larger base stations
  await fetchData(24);

  setInterval(() => fetchData(parseInt(document.getElementById('timeFilter').value)), 300000);
};
</script>
</body>
</html>
