<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TruNav RTK User Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        #map { height: 100vh; width: 100%; }
        body { margin: 0; font-family: Arial, sans-serif; }
    </style>
</head>
<body>
    <div class="flex flex-col h-screen">
        <header style="background:#111; color:white; padding:10px; display:flex; justify-content:space-between; align-items:center;">
            <h1>GEODNET RTK User Map</h1>
            <button onclick="fetchData()" style="padding:8px 16px; background:#0066cc; color:white; border:none; border-radius:4px;">
                Refresh Map
            </button>
        </header>
        
        <div id="map" style="flex:1;"></div>
    </div>

    <script>
        let map;
        let clientMarkers = [];

        async function fetchData() {
            try {
                console.log("Fetching from /api/sheets...");
                const res = await fetch('/api/sheets');
                
                if (!res.ok) {
                    throw new Error(`HTTP ${res.status}`);
                }

                const result = await res.json();
                console.log("API Response:", result);

                // Clear old markers
                clientMarkers.forEach(m => map.removeLayer(m));
                clientMarkers = [];

                const stations = result.data || [];

                stations.forEach(station => {
                    const lat = parseFloat(station.lat || station.latitude);
                    const lng = parseFloat(station.lng || station.longitude);

                    if (isNaN(lat) || isNaN(lng)) {
                        console.warn("Skipping station with invalid coords:", station);
                        return;
                    }

                    const marker = L.marker([lat, lng]).bindPopup(`
                        <b>${station.name || station.username || 'Unknown'}</b><br>
                        SN: ${station.miner_sn || 'N/A'}<br>
                        Status: ${station.status || 'Online'}
                    `);
                    
                    marker.addTo(map);
                    clientMarkers.push(marker);
                });

                console.log(`Added ${clientMarkers.length} markers`);

            } catch (err) {
                console.error("Failed to load map data:", err);
                alert("Error loading map data: " + err.message);
            }
        }

        // Initialize map
        window.onload = function() {
            map = L.map('map').setView([43.0, -96.5], 6);
            
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; OpenStreetMap'
            }).addTo(map);

            fetchData();
            setInterval(fetchData, 300000); // every 5 min
        };
    </script>
</body>
</html>
