<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RTK User Map</title>
    <link rel="icon" type="image/x-icon" href="./favicon.ico">
    <style>
        #map { height: 100vh; width: 100%; }
        .highlight-green { color: green; font-weight: bold; }
        .highlight-orange { color: orange; font-weight: bold; }
        .highlight-red { color: red; font-weight: bold; }
        .controls { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); z-index: 5; background: #ffffff; padding: 10px; border-radius: 5px; box-shadow: 0 2px 6px rgba(0,0,0,0.3); display: flex; gap: 10px; }
        .controls select { padding: 5px; font-size: 14px; border-radius: 3px; border: 1px solid #ccc; }
        #userSummaryPanel { position: absolute; top: 60px; left: 50%; transform: translateX(-50%); z-index: 5; background: #ffffff; padding: 15px; border-radius: 5px; box-shadow: 0 2px 6px rgba(0,0,0,0.3); display: none; font-family: Arial, sans-serif; min-width: 320px; }
    </style>
</head>
<body>
    <div id="map"></div>
    <div class="controls">
        <select id="timeframeFilter">
            <option value="1d" selected>Last 1 Day</option>
        </select>
    </div>
    <div id="userSummaryPanel"></div>
    <script>
        async function initMap() {
            const { Map } = await google.maps.importLibrary("maps");
            const { AdvancedMarkerElement, PinElement } = await google.maps.importLibrary("marker");
            const map = new Map(document.getElementById("map"), { center: { lat: 39, lng: -100 }, zoom: 4, mapId: "3fb7b56b54e97cfecb8a4769" });

            // Base Stations only for now
            try {
                const res = await fetch("https://sheets.googleapis.com/v4/spreadsheets/1E6u3Eyx_GHFpIbWGmEc6b00KoiWD0DsSSJwHZx686EA/values/Sheet2!A1:Z?key=AIzaSyCmDQKUXiUOiCQ_qhtUwQpxaaVtWQBIAj8");
                const data = await res.json();
                const rows = data.values;
                const headers = rows[0].map(h => h.toLowerCase());
                const latIdx = headers.indexOf("latitude");
                const lonIdx = headers.indexOf("longitude");

                rows.slice(1).forEach(row => {
                    const lat = parseFloat(row[latIdx]);
                    const lon = parseFloat(row[lonIdx]);
                    if (!isNaN(lat) && !isNaN(lon)) {
                        const pin = new PinElement({ background: "blue", scale: 1.2 });
                        new AdvancedMarkerElement({ position: { lat, lng: lon }, map, content: pin.element });
                    }
                });
            } catch (e) { console.error(e); }

            console.log("✅ Map loaded with base stations only (API still 401)");
        }

        (function() {
            const script = document.createElement('script');
            script.src = "https://maps.googleapis.com/maps/api/js?key=AIzaSyCmDQKUXiUOiCQ_qhtUwQpxaaVtWQBIAj8&callback=initMap&v=weekly&libraries=marker&loading=async";
            script.async = true;
            script.defer = true;
            document.head.appendChild(script);
        })();
    </script>
</body>
</html>
