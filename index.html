<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://unpkg.com https://cdn.jsdelivr.net 'unsafe-inline' 'unsafe-eval'; style-src 'self' https://unpkg.com 'unsafe-inline'; img-src 'self' data: https://*.tile.openstreetmap.org https://server.arcgisonline.com https://unpkg.com; connect-src 'self' https://*.vercel.app;">
  <title>TrueNav Active User Map</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link href="/output.css" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
  <style>
    /* Keep only styles that can't easily be moved to Tailwind */
    .leaflet-popup-content {
      font-size: 0.9rem;
      line-height: 1.4;
    }
    .leaflet-popup-content strong {
      display: inline-block;
      width: 120px;
      font-weight: 700;
    }
    .recent-marker-glow {
      position: relative;
      z-index: 1000;
      display: inline-block;
    }
    .recent-marker-glow::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 45px;
      height: 45px;
      background: rgba(0, 255, 0, 0.5);
      border-radius: 50%;
      z-index: -1;
      animation: glow 1.5s ease-in-out infinite;
    }
    @keyframes glow {
      0% { opacity: 0.5; }
      50% { opacity: 0.8; }
      100% { opacity: 0.5; }
    }
  </style>
</head>
<body class="m-0 font-sans">
  <div id="root" class="flex flex-col h-screen bg-gray-100"></div>
