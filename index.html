<script>
let map, markers = [];

async function fetchData(hours = 24) {
  const res = await fetch(`/api/sheets?hours=${hours}`);
  const json = await res.json();
  markers.forEach(m => map.removeLayer(m)); markers = [];

  (json.data || []).forEach(p => {
    const m = L.marker([p.latitude, p.longitude]).bindPopup(`
      <b>${p.username}</b><br>
      SN: ${p.miner_sn}<br>
      Status: ${p.status}<br>
      Time: ${p.loginTime ? new Date(p.loginTime).toLocaleString() : 'N/A'}<br>
      IP: ${p.ip || 'N/A'}
    `);
    m.addTo(map); markers.push(m);
  });
}

window.onload = () => {
  map = L.map('map').setView([43.55, -96.7], 9);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

  const sel = document.createElement('select');
  sel.innerHTML = `<option value="24">Last 24h</option><option value="168">Last 7 days</option><option value="720">Last 30 days</option>`;
  sel.onchange = () => fetchData(parseInt(sel.value));
  document.body.prepend(sel);

  fetchData(24);
  setInterval(() => fetchData(parseInt(sel.value)), 300000);
};
</script>
